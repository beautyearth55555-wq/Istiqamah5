name: Build Istiqamah APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q IstiqamahApp_GitHub_Actions_APK.zip -d extracted
          PROJECT=$(find extracted -type f -name settings.gradle.kts -print -quit | xargs dirname)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Istiqamah-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
